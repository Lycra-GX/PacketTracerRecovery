name: Build Windows Executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: nuget restore PacketTracerPatcher.csproj

      - name: Build Release executable
        run: msbuild PacketTracerPatcher.csproj /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketTracerPatcher-windows-executable
          path: |
            bin/Release/*.exe
            bin/Release/*.pdb
            bin/Release/*.config
          if-no-files-found: error
